name: Draft deployment release

# Test copy of rounds_api's workflow of the same name. Runs on every version
# tag push and drafts (or updates) a GitHub release whose body is a checklist
# generated from .github/deploy-targets.json. Whoever is cutting the release
# ticks the services this build should reach, then hits Publish. The
# "Deployment PR" workflow reads those checked boxes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  Draft-Release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build checklist body
        id: body
        run: |
          {
            echo "<!-- deploy-checklist:start -->"
            echo "Tick every service this release (\`$TAG\`) should be promoted to."
            echo "The Deployment PR workflow reads only the checked boxes below — untouched services are left alone."
            echo
            echo "### API / Web"
            jq -r '.api_tier | keys[] | "- [ ] " + .' .github/deploy-targets.json
            echo
            echo "### Celery"
            jq -r '.celery | keys[] | "- [ ] " + .' .github/deploy-targets.json
            echo
            echo "### Other"
            jq -r '.other | keys[] | "- [ ] " + .' .github/deploy-targets.json
            echo "<!-- deploy-checklist:end -->"
          } > release_body.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as-is."
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes-file release_body.md
          fi
