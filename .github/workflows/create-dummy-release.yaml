name: Create dummy release

# Manual button: bumps a patch version and pushes a new v* tag.
# Must use a PAT, not GITHUB_TOKEN -- GitHub won't let a token-authored push
# retrigger another workflow in the same repo (this is why the real
# rounds_ikigai_proxy repo's create-release.yml uses DEVOPS_PAT too).
on:
  workflow_dispatch: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # Hand our PAT to checkout directly -- this is GitHub's documented way
      # to push changes back with a PAT, and it wires up auth the same way
      # actions/checkout wires up the default GITHUB_TOKEN
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEV_REPO_PAT }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Prove the token this job actually has works, before blaming git
      - name: Sanity check token permissions
        env:
          GH_TOKEN: ${{ secrets.DEV_REPO_PAT }}
        run: |
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}" \
            | grep -A6 '"permissions"' || echo "no permissions field -- token likely invalid"

      # Read the last v* tag and bump the patch number
      - name: Compute next tag
        id: next
        run: |
          git fetch --tags
          LAST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LAST=${LAST:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          echo "tag=v${MAJOR}.${MINOR}.$((PATCH + 1))" >> $GITHUB_OUTPUT
          echo "Previous: $LAST"

      # Push the tag -- this fires proxy.yaml's push:tags trigger
      - name: Push tag
        run: |
          git tag "${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"
          echo "Pushed ${{ steps.next.outputs.tag }}"
