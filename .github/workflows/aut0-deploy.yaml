name: Ikigai-web deployment PR

# Runs after "Proxy build" pushes the image to ECR, and opens a tag-bump PR in
# rounds_deployment. Review and merge stay manual; ArgoCD syncs on merge.
on:
  workflow_run:
    workflows: ["Proxy build"]
    types: [completed]

jobs:
  Raise-Deployment-PR:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_FILE: ikigai-web/deploy.yaml
      IMAGE: 961328178101.dkr.ecr.ap-south-1.amazonaws.com/rounds-ikigai-proxy
      # The build is triggered by a v* tag push, so head_branch is that tag
      NEW_TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check out deployment repo
        uses: actions/checkout@v4
        with:
          repository: manojgowda-marrow/ruleset-test
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          ref: main

      # Swap the rounds-proxy tag only; the ikigai-web init container is left alone
      - name: Bump image tag
        id: bump
        run: |
          OLD_TAG=$(grep -oPm1 "(?<=rounds-ikigai-proxy:)\S+" $DEPLOY_FILE)
          sed -i "s|$IMAGE:$OLD_TAG|$IMAGE:$NEW_TAG|" $DEPLOY_FILE
          echo "old_tag=$OLD_TAG" >> $GITHUB_OUTPUT
          git diff --stat

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          OLD_TAG: ${{ steps.bump.outputs.old_tag }}
        run: |
          BRANCH="$(TZ=Asia/Kolkata date +%-d-%-m-%Y)-ikigai"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B $BRANCH
          git commit -am "ikigai-web $OLD_TAG -> $NEW_TAG"
          git push -f origin $BRANCH
          gh pr create --base main --head $BRANCH \
            --title "ikigai-web $OLD_TAG -> $NEW_TAG" \
            --body "Automated bump of rounds-ikigai-proxy in \`$DEPLOY_FILE\`." \
            || echo "PR already open for $BRANCH"
