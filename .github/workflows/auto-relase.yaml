name: Release Publish (sync develop + tag + Slack)

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  publish-release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          # Deploy key (write) is on the develop ruleset bypass list, so the force-push is allowed.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Release info
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          VERSION="${HEAD_REF#release/}"
          echo "Release version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Create tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::warning::Release ${VERSION} already exists; skipping tag and release creation." >&2
            exit 0
          fi
          # Push tag with deploy key so the tag-triggered workflow runs.
          git tag "${VERSION}" "${MERGE_SHA}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" --verify-tag --generate-notes

      # Rebase develop onto main; fails on conflict.
      - name: Sync develop with main
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B develop origin/develop
          git rebase origin/main
          git push origin develop --force-with-lease

      - name: Notify Slack
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          TEXT: |-
            ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} Release publish status : ${{ job.status }}
            Release Tag : ${{ job.status == 'success' && format('<{0}/{1}/releases/tag/{2}|{2}>', github.server_url, github.repository, steps.version.outputs.version) || steps.version.outputs.version }}
            Branch : ${{ github.event.pull_request.base.ref }}
            Commit Message : ${{ steps.version.outputs.commit_msg }}
        run: |
          jq -n --arg text "$TEXT" --arg channel "$SLACK_CHANNEL" '{text: $text, channel: $channel}' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
