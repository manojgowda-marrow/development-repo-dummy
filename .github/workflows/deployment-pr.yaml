name: Deployment PR

# Test copy of rounds_api's workflow of the same name, pointed at the
# ruleset-test dummy deployment repo instead of rounds_deployment. Runs when
# a deployment release (drafted by "Draft deployment release") is published.
# Reads which services were checked in the release body, then opens ONE PR
# in ruleset-test bumping only those services' deploy files.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  Raise-Deployment-PR:
    runs-on: ubuntu-latest
    env:
      NEW_TAG: ${{ github.event.release.tag_name }}
      IMAGE: 961328178101.dkr.ecr.ap-south-1.amazonaws.com/rounds-api
      DEPLOYMENT_REPO: manojgowda-marrow/ruleset-test
    steps:
      - name: Check out development-repo-dummy (for deploy-targets.json)
        uses: actions/checkout@v4

      - name: Extract checked services from release body
        id: targets
        run: |
          jq -r '.release.body' "$GITHUB_EVENT_PATH" > release_body.md
          grep -oE '^- \[[xX]\] [A-Za-z0-9._-]+' release_body.md | sed -E 's/^- \[[xX]\] //' > checked.txt || true

          jq -r '.api_tier + .celery + .other' .github/deploy-targets.json > flat-targets.json

          > selected_paths.txt
          > unknown.txt
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            path=$(jq -r --arg n "$name" '.[$n] // empty' flat-targets.json)
            if [ -z "$path" ]; then
              echo "$name" >> unknown.txt
            else
              echo "$name:$path" >> selected_paths.txt
            fi
          done < checked.txt

          {
            echo "count=$(wc -l < selected_paths.txt | tr -d ' ')"
          } >> "$GITHUB_OUTPUT"

          echo "Selected:"; cat selected_paths.txt
          echo "Unknown:"; cat unknown.txt

      - name: Stop if nothing was selected
        if: ${{ steps.targets.outputs.count == '0' }}
        run: echo "No services selected, exiting."

      - name: Check out deployment repo
        if: ${{ steps.targets.outputs.count != '0' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOYMENT_REPO }}
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          ref: main
          path: deploy_repo

      - name: Bump image tags for selected services only
        if: ${{ steps.targets.outputs.count != '0' }}
        id: bump
        run: |
          > bump_summary.txt
          while IFS=: read -r name path; do
            [ -z "$name" ] && continue
            file="deploy_repo/$path"
            if [ ! -f "$file" ]; then
              echo "$name: file $path not found, skipping" | tee -a bump_summary.txt
              continue
            fi
            OLD_TAG=$(grep -oPm1 "(?<=rounds-api:)\S+" "$file" || true)
            if [ -z "$OLD_TAG" ]; then
              echo "$name: no rounds-api tag found in $path, skipping" | tee -a bump_summary.txt
              continue
            fi
            case "$OLD_TAG" in
              celery-*) NEW=celery-$NEW_TAG ;;
              *) NEW=$NEW_TAG ;;
            esac
            if [ "$OLD_TAG" = "$NEW" ]; then
              echo "$name: already at $NEW, skipping" | tee -a bump_summary.txt
              continue
            fi
            sed -i "s|$IMAGE:$OLD_TAG|$IMAGE:$NEW|" "$file"
            echo "$name: $OLD_TAG -> $NEW" | tee -a bump_summary.txt
          done < selected_paths.txt

          cd deploy_repo && git diff --stat

      - name: Open PR
        if: ${{ steps.targets.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
        run: |
          cd deploy_repo
          if git diff --quiet; then
            echo "No files actually changed, nothing to open a PR for."
            exit 0
          fi
          BRANCH="deploy-test/$(TZ=Asia/Kolkata date +%-d-%-m-%Y)-$NEW_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "Deploy $NEW_TAG: $(grep -c ':' ../bump_summary.txt) service(s)"
          git push -f origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "[TEST] Deploy $NEW_TAG" \
            --body "$(printf 'Automated test bump for release `%s`.\n\n%s' "$NEW_TAG" "$(cat ../bump_summary.txt)")" \
            || echo "PR already open for $BRANCH"
